<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>VectorCraft Mobile - Image to SVG Vectorizer</title>
  <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --bg-input: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #475569;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.5;
      padding: 16px;
      padding-bottom: 90px; /* space for sticky bar */
      overflow-x: hidden;
      overflow-y: auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Buttons & Controls */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 8px 16px;
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-accent {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .btn-full {
      width: 100%;
    }

    input[type="file"] {
      display: none;
    }

    /* Preset Tags */
    .preset-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .preset-btn {
      white-space: nowrap;
      padding: 8px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .preset-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    /* Sliders */
    .control-group {
      margin-bottom: 14px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .control-group input[type="range"] {
      width: 100%;
      height: 6px;
      accent-color: var(--accent);
      background: var(--bg-input);
      border-radius: 3px;
      outline: none;
    }

    /* Split Preview Stage */
    .stage-container {
      position: relative;
      width: 100%;
      height: 320px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      background-color: #000;
      background-image: 
        linear-gradient(45deg, #1e293b 25%, transparent 25%),
        linear-gradient(-45deg, #1e293b 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1e293b 75%),
        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .stage-layer img, 
    .stage-layer svg {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    #svgLayer {
      z-index: 2;
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }

    #rasterLayer {
      z-index: 1;
    }

    /* Curtain Divider Handle */
    #curtainLine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 3px;
      background: var(--accent);
      z-index: 3;
      transform: translateX(-50%);
      pointer-events: none;
    }

    #curtainHandle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 34px;
      height: 34px;
      background: var(--accent);
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: ew-resize;
      touch-action: pan-y; /* Crucial: allows vertical scrolling across the page! */
    }

    #curtainHandle::after {
      content: "◀ ▶";
      font-size: 10px;
      color: #0f172a;
      font-weight: 800;
    }

    .meta-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
      text-align: center;
    }

    .metric-box {
      background: var(--bg-primary);
      border-radius: 8px;
      padding: 8px 4px;
      border: 1px solid var(--border);
    }

    .metric-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Sticky Bottom Actions */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    /* Status indicator */
    #statusText {
      font-size: 0.8rem;
      text-align: center;
      margin-top: 8px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>VectorCraft Studio</h1>
    <p>Convert raster photos to clean, scalable SVG paths</p>
  </header>

  <!-- Upload Section -->
  <section class="card">
    <div class="card-title">
      <span>1. Load Image</span>
      <button class="btn" style="min-height:32px; padding:4px 8px; font-size:0.75rem;" id="loadDemoBtn">Try Sample</button>
    </div>

    <div class="btn-grid">
      <label class="btn" for="galleryInput">Choose File</label>
      <label class="btn" for="cameraInput">Camera</label>
    </div>

    <input type="file" id="galleryInput" accept="image/*">
    <input type="file" id="cameraInput" accept="image/*" capture="environment">

    <div id="statusText">Ready for input</div>
  </section>

  <!-- Stage Comparison Preview -->
  <section class="card">
    <div class="card-title">
      <span>2. Interactive Comparison</span>
      <span style="font-size:0.75rem; color:var(--text-muted);">SVG (Left) | Original (Right)</span>
    </div>

    <div class="stage-container" id="stageContainer">
      <div class="stage-layer" id="rasterLayer">
        <img id="rasterImg" alt="Source raster preview" />
      </div>
      <div class="stage-layer" id="svgLayer">
        <div id="svgContainer" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;"></div>
      </div>
      <div id="curtainLine"></div>
      <div id="curtainHandle"></div>
    </div>

    <div class="meta-metrics">
      <div class="metric-box">
        <div class="metric-val" id="valColors">0</div>
        <div class="metric-label">Colors</div>
      </div>
      <div class="metric-box">
        <div class="metric-val" id="valPaths">0</div>
        <div class="metric-label">Paths</div>
      </div>
      <div class="metric-box">
        <div class="metric-val" id="valSize">0 KB</div>
        <div class="metric-label">SVG Size</div>
      </div>
    </div>
  </section>

  <!-- Configuration Controls -->
  <section class="card">
    <div class="card-title">3. Trace Controls</div>

    <div class="preset-container">
      <button class="preset-btn active" data-preset="default">Vibrant Color</button>
      <button class="preset-btn" data-preset="poster">Posterize</button>
      <button class="preset-btn" data-preset="mono">Monochrome</button>
      <button class="preset-btn" data-preset="detailed">High Detail</button>
    </div>

    <div class="control-group">
      <label>
        <span>Color Palette</span>
        <span id="colorsDisplay">16</span>
      </label>
      <input type="range" id="colorsSlider" min="2" max="32" value="16">
    </div>

    <div class="control-group">
      <label>
        <span>Max Tracing Res (Speed/RAM Guard)</span>
        <span id="resDisplay">360px</span>
      </label>
      <input type="range" id="resSlider" min="160" max="640" step="40" value="360">
    </div>

    <div class="control-group">
      <label>
        <span>Curve Smoothness</span>
        <span id="smoothDisplay">1.0</span>
      </label>
      <input type="range" id="smoothSlider" min="0.2" max="3.0" step="0.2" value="1.0">
    </div>

    <div class="control-group">
      <label>
        <span>Speckle Filter (Noise cutoff)</span>
        <span id="speckleDisplay">8px</span>
      </label>
      <input type="range" id="speckleSlider" min="0" max="32" step="2" value="8">
    </div>
  </section>

  <!-- Sticky Bottom Dock -->
  <div class="bottom-dock">
    <button class="btn btn-full" id="copySvgBtn">Copy SVG</button>
    <button class="btn btn-full btn-accent" id="downloadSvgBtn">Download SVG</button>
  </div>

  <canvas id="hiddenCanvas" style="display:none;"></canvas>

  <script>
    // State management
    const state = {
      imageLoaded: false,
      rawImage: null,
      currentSvgString: '',
      colors: 16,
      maxRes: 360,
      smoothness: 1.0,
      speckle: 8,
      isMono: false,
      curtainPos: 50
    };

    // DOM References
    const rasterImg = document.getElementById('rasterImg');
    const svgContainer = document.getElementById('svgContainer');
    const svgLayer = document.getElementById('svgLayer');
    const curtainLine = document.getElementById('curtainLine');
    const curtainHandle = document.getElementById('curtainHandle');
    const stageContainer = document.getElementById('stageContainer');
    const statusText = document.getElementById('statusText');
    const hiddenCanvas = document.getElementById('hiddenCanvas');

    // Metrics
    const valColors = document.getElementById('valColors');
    const valPaths = document.getElementById('valPaths');
    const valSize = document.getElementById('valSize');

    // Controls
    const colorsSlider = document.getElementById('colorsSlider');
    const colorsDisplay = document.getElementById('colorsDisplay');
    const resSlider = document.getElementById('resSlider');
    const resDisplay = document.getElementById('resDisplay');
    const smoothSlider = document.getElementById('smoothSlider');
    const smoothDisplay = document.getElementById('smoothDisplay');
    const speckleSlider = document.getElementById('speckleSlider');
    const speckleDisplay = document.getElementById('speckleDisplay');

    // Ingest Image from File
    function handleImageFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      statusText.textContent = 'Reading image...';

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          state.rawImage = img;
          state.imageLoaded = true;
          rasterImg.src = img.src;
          runVectorization();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('galleryInput').addEventListener('change', (e) => handleImageFile(e.target.files[0]));
    document.getElementById('cameraInput').addEventListener('change', (e) => handleImageFile(e.target.files[0]));

    // Generate Procedural Demo Image
    document.getElementById('loadDemoBtn').addEventListener('click', () => {
      const demoCanvas = document.createElement('canvas');
      demoCanvas.width = 400;
      demoCanvas.height = 400;
      const ctx = demoCanvas.getContext('2d');

      // Draw geometric shape
      const grad = ctx.createLinearGradient(0, 0, 400, 400);
      grad.addColorStop(0, '#f43f5e');
      grad.addColorStop(0.5, '#8b5cf6');
      grad.addColorStop(1, '#06b6d4');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 400, 400);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(200, 200, 110, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(200, 200, 70, 0, Math.PI * 2);
      ctx.fill();

      const img = new Image();
      img.onload = () => {
        state.rawImage = img;
        state.imageLoaded = true;
        rasterImg.src = img.src;
        runVectorization();
      };
      img.src = demoCanvas.toDataURL();
    });

    // Tracing Core with Offscreen Downscaling Protection
    function runVectorization() {
      if (!state.imageLoaded || !state.rawImage) return;

      statusText.textContent = 'Vectorizing...';

      setTimeout(() => {
        try {
          const img = state.rawImage;
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;

          // Safe scale down to prevent device memory exhaustion
          const maxDim = state.maxRes;
          if (w > maxDim || h > maxDim) {
            const ratio = Math.min(maxDim / w, maxDim / h);
            w = Math.max(32, Math.round(w * ratio));
            h = Math.max(32, Math.round(h * ratio));
          }

          hiddenCanvas.width = w;
          hiddenCanvas.height = h;
          const ctx = hiddenCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const imgData = ctx.getImageData(0, 0, w, h);

          const options = {
            corsenabled: false,
            ltres: state.smoothness,
            qtres: state.smoothness,
            pathomit: state.speckle,
            colorquantcycles: 2,
            numberofcolors: state.isMono ? 2 : state.colors,
            colorsampling: state.isMono ? 0 : 2
          };

          const svgStr = ImageTracer.imagedataToSVG(imgData, options);

          state.currentSvgString = svgStr;
          svgContainer.innerHTML = svgStr;

          // Metrics update
          const pathMatches = svgStr.match(/<path/gi);
          const pathCount = pathMatches ? pathMatches.length : 0;
          const sizeKb = (new Blob([svgStr]).size / 1024).toFixed(1);

          valColors.textContent = state.isMono ? '2' : state.colors;
          valPaths.textContent = pathCount;
          valSize.textContent = sizeKb + ' KB';

          statusText.textContent = `Completed in ${w}×${h}px`;
        } catch (err) {
          console.error(err);
          statusText.textContent = 'Error processing image: ' + err.message;
        }
      }, 40);
    }

    // Sliders Event Handlers
    colorsSlider.addEventListener('input', (e) => {
      state.colors = parseInt(e.target.value, 10);
      colorsDisplay.textContent = state.colors;
      runVectorization();
    });

    resSlider.addEventListener('input', (e) => {
      state.maxRes = parseInt(e.target.value, 10);
      resDisplay.textContent = state.maxRes + 'px';
      runVectorization();
    });

    smoothSlider.addEventListener('input', (e) => {
      state.smoothness = parseFloat(e.target.value);
      smoothDisplay.textContent = state.smoothness.toFixed(1);
      runVectorization();
    });

    speckleSlider.addEventListener('input', (e) => {
      state.speckle = parseInt(e.target.value, 10);
      speckleDisplay.textContent = state.speckle + 'px';
      runVectorization();
    });

    // Preset Buttons
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const p = btn.dataset.preset;
        if (p === 'default') {
          state.colors = 16;
          state.smoothness = 1.0;
          state.speckle = 8;
          state.isMono = false;
        } else if (p === 'poster') {
          state.colors = 6;
          state.smoothness = 1.6;
          state.speckle = 16;
          state.isMono = false;
        } else if (p === 'mono') {
          state.colors = 2;
          state.smoothness = 1.0;
          state.speckle = 8;
          state.isMono = true;
        } else if (p === 'detailed') {
          state.colors = 32;
          state.smoothness = 0.4;
          state.speckle = 2;
          state.isMono = false;
        }

        colorsSlider.value = state.colors;
        colorsDisplay.textContent = state.colors;
        smoothSlider.value = state.smoothness;
        smoothDisplay.textContent = state.smoothness.toFixed(1);
        speckleSlider.value = state.speckle;
        speckleDisplay.textContent = state.speckle + 'px';

        runVectorization();
      });
    });

    // Curtain Split Slider Dragging (Touch & Mouse)
    let isDraggingCurtain = false;

    function updateCurtain(clientX) {
      const rect = stageContainer.getBoundingClientRect();
      let pos = ((clientX - rect.left) / rect.width) * 100;
      pos = Math.max(0, Math.min(100, pos));
      state.curtainPos = pos;
      curtainLine.style.left = pos + '%';
      curtainHandle.style.left = pos + '%';
      svgLayer.style.clipPath = `polygon(0 0, ${pos}% 0, ${pos}% 100%, 0 100%)`;
    }

    curtainHandle.addEventListener('mousedown', () => isDraggingCurtain = true);
    window.addEventListener('mouseup', () => isDraggingCurtain = false);
    window.addEventListener('mousemove', (e) => {
      if (isDraggingCurtain) updateCurtain(e.clientX);
    });

    curtainHandle.addEventListener('touchstart', (e) => {
      isDraggingCurtain = true;
    }, { passive: true });

    window.addEventListener('touchend', () => isDraggingCurtain = false);
    window.addEventListener('touchmove', (e) => {
      if (isDraggingCurtain && e.touches.length > 0) {
        updateCurtain(e.touches[0].clientX);
      }
    }, { passive: true });

    // Download & Copy Handlers
    document.getElementById('downloadSvgBtn').addEventListener('click', () => {
      if (!state.currentSvgString) {
        alert('Please load an image first.');
        return;
      }
      const blob = new Blob([state.currentSvgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'vectorcraft_export.svg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    document.getElementById('copySvgBtn').addEventListener('click', async () => {
      if (!state.currentSvgString) {
        alert('Please load an image first.');
        return;
      }
      try {
        await navigator.clipboard.writeText(state.currentSvgString);
        const originalText = document.getElementById('copySvgBtn').textContent;
        document.getElementById('copySvgBtn').textContent = 'Copied!';
        setTimeout(() => {
          document.getElementById('copySvgBtn').textContent = originalText;
        }, 2000);
      } catch (err) {
        alert('Unable to access clipboard.');
      }
    });

    // Auto-load sample on startup
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('loadDemoBtn').click();
    });
  </script>
</body>
</html>
