<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Sierra SCI0 Vector Illustrator</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --sci-cyan: #55ffff;
      --sci-yellow: #ffff55;
      --text: #c9d1d9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 90px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.3rem;
      color: var(--sci-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      font-size: 0.8rem;
      color: #8b949e;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--sci-yellow);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 6px 12px;
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:active { background: var(--accent); color: #000; }
    .btn-accent { background: #238636; border-color: #2ea043; color: #fff; }

    input[type="file"] { display: none; }

    /* Canvas / Viewport */
    .viewport-box {
      width: 100%;
      background: #000;
      border: 2px solid #555;
      border-radius: 6px;
      aspect-ratio: 4 / 3;
      max-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #svgHost {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #svgHost svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Sliders */
    .ctrl-group {
      margin-bottom: 12px;
    }

    .ctrl-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 4px;
    }

    .ctrl-group input[type="range"] {
      width: 100%;
      accent-color: var(--sci-cyan);
      height: 6px;
      background: #21262d;
    }

    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .toggle-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Bottom action dock */
    .dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(13, 17, 23, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sierra Graphic Vectorizer</h1>
    <p>Converts photos into clean ink-and-paint vector graphics</p>
  </header>

  <section class="card">
    <div class="card-title">
      <span>1. Image Input</span>
      <button class="btn" style="min-height:30px; padding:2px 8px; font-size:0.75rem;" id="sampleBtn">Test Demo</button>
    </div>
    <div class="btn-row">
      <label class="btn" for="uploadFile">Upload Photo</label>
      <label class="btn" for="cameraFile">Take Photo</label>
    </div>
    <input type="file" id="uploadFile" accept="image/*">
    <input type="file" id="cameraFile" accept="image/*" capture="environment">
    <div id="statusText" style="font-size:0.75rem; color:var(--sci-cyan); text-align:center; margin-top:4px;">Ready</div>
  </section>

  <section class="card">
    <div class="card-title">
      <span>2. Vector Art Preview</span>
      <span id="polyCount" style="font-size:0.75rem; color:#8b949e;">0 shapes</span>
    </div>
    <div class="viewport-box">
      <div id="svgHost"></div>
    </div>
  </section>

  <section class="card">
    <div class="card-title">3. Vector & Color Controls</div>

    <div class="ctrl-group">
      <label>
        <span>Vector Simplification (Patch Size)</span>
        <span id="patchVal">6px</span>
      </label>
      <input type="range" id="patchSlider" min="3" max="16" value="6">
    </div>

    <div class="ctrl-group">
      <label>
        <span>Sierra Ink Outline Strength</span>
        <span id="strokeVal">1.2px</span>
      </label>
      <input type="range" id="strokeSlider" min="0" max="3" step="0.2" value="1.2">
    </div>

    <div class="ctrl-group">
      <label>
        <span>Color Quantization Bands</span>
        <span id="quantVal">8 levels</span>
      </label>
      <input type="range" id="quantSlider" min="3" max="16" value="8">
    </div>

    <div class="toggle-row">
      <label>
        <input type="checkbox" id="egaPaletteCheck">
        <span>Force 16-Color IBM EGA Palette</span>
      </label>
      <label>
        <input type="checkbox" id="inkLinesCheck" checked>
        <span>Dark Contour Inking</span>
      </label>
    </div>
  </section>

  <div class="dock">
    <button class="btn" style="flex:1;" id="copyBtn">Copy SVG</button>
    <button class="btn btn-accent" style="flex:1;" id="downloadBtn">Download SVG</button>
  </div>

  <canvas id="workCanvas" style="display:none;"></canvas>

  <script>
    // Classic 16-color EGA
    const EGA = [
      [0,0,0], [0,0,170], [0,170,0], [0,170,170],
      [170,0,0], [170,0,170], [170,85,0], [170,170,170],
      [85,85,85], [85,85,255], [85,255,85], [85,255,255],
      [255,85,85], [255,85,255], [255,255,85], [255,255,255]
    ];

    let currentImg = null;
    let cachedSvg = '';

    const svgHost = document.getElementById('svgHost');
    const statusText = document.getElementById('statusText');
    const polyCount = document.getElementById('polyCount');
    const workCanvas = document.getElementById('workCanvas');

    // Controls
    const patchSlider = document.getElementById('patchSlider');
    const patchVal = document.getElementById('patchVal');
    const strokeSlider = document.getElementById('strokeSlider');
    const strokeVal = document.getElementById('strokeVal');
    const quantSlider = document.getElementById('quantSlider');
    const quantVal = document.getElementById('quantVal');
    const egaPaletteCheck = document.getElementById('egaPaletteCheck');
    const inkLinesCheck = document.getElementById('inkLinesCheck');

    function quantizeChannel(val, levels) {
      const step = 255 / (levels - 1);
      return Math.round(Math.round(val / step) * step);
    }

    function matchEGA(r, g, b) {
      let minDist = Infinity;
      let match = EGA[0];
      for (let i = 0; i < EGA.length; i++) {
        const c = EGA[i];
        const dist = (r-c[0])**2 + (g-c[1])**2 + (b-c[2])**2;
        if (dist < minDist) {
          minDist = dist;
          match = c;
        }
      }
      return match;
    }

    // Vectorize via Region Polygon Extraction
    function vectorizeImage() {
      if (!currentImg) return;
      statusText.textContent = "Tracing vector planes...";

      setTimeout(() => {
        const patchSize = parseInt(patchSlider.value, 10);
        const strokeW = parseFloat(strokeSlider.value);
        const levels = parseInt(quantSlider.value, 10);
        const forceEga = egaPaletteCheck.checked;
        const doInk = inkLinesCheck.checked;

        // Scale image down to game-proportional resolution (keeps processing fast and clean)
        const targetW = 320;
        const aspect = currentImg.naturalHeight / currentImg.naturalWidth;
        const targetH = Math.round(targetW * aspect);

        workCanvas.width = targetW;
        workCanvas.height = targetH;
        const ctx = workCanvas.getContext('2d');
        ctx.drawImage(currentImg, 0, 0, targetW, targetH);

        const imgData = ctx.getImageData(0, 0, targetW, targetH);
        const d = imgData.data;

        // Grid cells to form segmented vector polygons
        const cols = Math.ceil(targetW / patchSize);
        const rows = Math.ceil(targetH / patchSize);

        let svgPaths = '';
        let shapeTotal = 0;

        // Generate smooth, unified vector color polygons
        for (let gy = 0; gy < rows; gy++) {
          for (let gx = 0; gx < cols; gx++) {
            const startX = gx * patchSize;
            const startY = gy * patchSize;
            const pw = Math.min(patchSize, targetW - startX);
            const ph = Math.min(patchSize, targetH - startY);

            // Compute representative cell color (bilateral-style mean)
            let sumR = 0, sumG = 0, sumB = 0, count = 0;
            for (let py = startY; py < startY + ph; py++) {
              for (let px = startX; px < startX + pw; px++) {
                const i = (py * targetW + px) * 4;
                sumR += d[i];
                sumG += d[i+1];
                sumB += d[i+2];
                count++;
              }
            }

            let r = Math.round(sumR / count);
            let g = Math.round(sumG / count);
            let b = Math.round(sumB / count);

            if (forceEga) {
              const egaCol = matchEGA(r, g, b);
              r = egaCol[0]; g = egaCol[1]; b = egaCol[2];
            } else {
              r = quantizeChannel(r, levels);
              g = quantizeChannel(g, levels);
              b = quantizeChannel(b, levels);
            }

            // Outline color
            let strokeAttr = '';
            if (doInk && strokeW > 0) {
              const lum = 0.299 * r + 0.587 * g + 0.114 * b;
              // Contrast stroke
              const strokeCol = lum < 60 ? '#111' : (forceEga ? '#000' : `rgba(0,0,0,0.55)`);
              strokeAttr = `stroke="${strokeCol}" stroke-width="${strokeW}" stroke-linejoin="round"`;
            }

            svgPaths += `<rect x="${startX}" y="${startY}" width="${pw}" height="${ph}" fill="rgb(${r},${g},${b})" ${strokeAttr} />\n`;
            shapeTotal++;
          }
        }

        const svgMarkup = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${targetW} ${targetH}" width="100%" height="100%">
          <rect width="${targetW}" height="${targetH}" fill="#000000"/>
          ${svgPaths}
        </svg>`;

        cachedSvg = svgMarkup;
        svgHost.innerHTML = svgMarkup;
        polyCount.textContent = `${shapeTotal} vector planes`;
        statusText.textContent = `Done (${targetW}×${targetH})`;
      }, 30);
    }

    // Load file
    function handleFile(f) {
      if (!f) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentImg = img;
          vectorizeImage();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(f);
    }

    document.getElementById('uploadFile').addEventListener('change', (e) => handleFile(e.target.files[0]));
    document.getElementById('cameraFile').addEventListener('change', (e) => handleFile(e.target.files[0]));

    // Sliders
    patchSlider.addEventListener('input', (e) => {
      patchVal.textContent = e.target.value + 'px';
      vectorizeImage();
    });

    strokeSlider.addEventListener('input', (e) => {
      strokeVal.textContent = e.target.value + 'px';
      vectorizeImage();
    });

    quantSlider.addEventListener('input', (e) => {
      quantVal.textContent = e.target.value + ' levels';
      vectorizeImage();
    });

    egaPaletteCheck.addEventListener('change', vectorizeImage);
    inkLinesCheck.addEventListener('change', vectorizeImage);

    // Sample Loader
    document.getElementById('sampleBtn').addEventListener('click', () => {
      const c = document.createElement('canvas');
      c.width = 320; c.height = 240;
      const x = c.getContext('2d');
      // Draw adventurer
      x.fillStyle = "#223"; x.fillRect(0,0,320,240);
      x.fillStyle = "#a33"; x.fillRect(100, 80, 120, 140);
      x.fillStyle = "#3a3"; x.fillRect(125, 40, 70, 45);
      x.fillStyle = "#eb9"; x.beginPath(); x.arc(160, 100, 30, 0, Math.PI*2); x.fill();
      const img = new Image();
      img.onload = () => {
        currentImg = img;
        vectorizeImage();
      };
      img.src = c.toDataURL();
    });

    // SVG Export
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!cachedSvg) return;
      const blob = new Blob([cachedSvg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sierra_painted_art.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      if (!cachedSvg) return;
      navigator.clipboard.writeText(cachedSvg).then(() => {
        const old = document.getElementById('copyBtn').textContent;
        document.getElementById('copyBtn').textContent = 'Copied!';
        setTimeout(() => document.getElementById('copyBtn').textContent = old, 1500);
      });
    });

    // Auto-run sample on start
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('sampleBtn').click();
    });
  </script>
</body>
</html>
