<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Camera Filter Studio</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn-icon:hover {
      background-color: #334155;
    }

    /* Viewport Area */
    .viewport-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    video, img#imagePreview {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      transition: filter 0.15s ease-out;
    }

    /* Hidden file input & capture canvas */
    #fileInput, #captureCanvas {
      display: none;
    }

    /* Bottom Control Dashboard */
    .controls-panel {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    /* Presets Carousel */
    .presets-bar {
      display: flex;
      gap: 10px;
      padding: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .presets-bar::-webkit-scrollbar {
      display: none;
    }

    .preset-btn {
      flex: 0 0 auto;
      padding: 8px 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .preset-btn.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border-color: var(--accent);
    }

    /* Adjustment Sliders Tab */
    .sliders-panel {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 16px;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border-top: 1px solid var(--border);
      max-height: 120px;
      overflow-y: auto;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .slider-group div {
      display: flex;
      justify-content: space-between;
    }

    .slider-group input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Action Bar (Capture / Download) */
    .action-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 16px 18px;
    }

    .btn-toggle-sliders {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-shutter {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid var(--bg-card);
      outline: 2px solid #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: transform 0.1s;
    }

    .btn-shutter:active {
      transform: scale(0.92);
    }

    .btn-download {
      background: var(--accent);
      color: #0f172a;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }

    .btn-download:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <header>
    <h1>Camera Filter Studio</h1>
    <div class="top-actions">
      <button id="btnSwitchCamera" class="btn-icon" title="Flip Camera">🔄</button>
      <button id="btnUpload" class="btn-icon" title="Upload Image">📁</button>
      <input type="file" id="fileInput" accept="image/*">
    </div>
  </header>

  <div class="viewport-container">
    <video id="videoPreview" autoplay playsinline></video>
    <img id="imagePreview" alt="Upload Preview" style="display: none;">
  </div>

  <div class="controls-panel">
    <!-- Presets -->
    <div class="presets-bar" id="presetsBar">
      <button class="preset-btn active" data-filter="normal">Normal</button>
      <button class="preset-btn" data-filter="grayscale">B&amp;W</button>
      <button class="preset-btn" data-filter="sepia">Sepia</button>
      <button class="preset-btn" data-filter="vintage">Vintage</button>
      <button class="preset-btn" data-filter="cyberpunk">Cyberpunk</button>
      <button class="preset-btn" data-filter="dramatic">Dramatic</button>
      <button class="preset-btn" data-filter="warm">Golden Hour</button>
      <button class="preset-btn" data-filter="cool">Nordic Cold</button>
      <button class="preset-btn" data-filter="invert">Negative</button>
    </div>

    <!-- Fine-Tuning Sliders -->
    <div class="sliders-panel" id="slidersPanel">
      <div class="slider-group">
        <div><span>Brightness</span><span id="valBrightness">100%</span></div>
        <input type="range" id="sliderBrightness" min="20" max="200" value="100">
      </div>
      <div class="slider-group">
        <div><span>Contrast</span><span id="valContrast">100%</span></div>
        <input type="range" id="sliderContrast" min="20" max="200" value="100">
      </div>
      <div class="slider-group">
        <div><span>Saturation</span><span id="valSaturation">100%</span></div>
        <input type="range" id="sliderSaturation" min="0" max="300" value="100">
      </div>
      <div class="slider-group">
        <div><span>Hue Rotate</span><span id="valHue">0°</span></div>
        <input type="range" id="sliderHue" min="0" max="360" value="0">
      </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
      <button class="btn-toggle-sliders" id="btnToggleSliders">
        <span>⚙️</span>
        <span>Tune</span>
      </button>

      <button class="btn-shutter" id="btnCapture" title="Snap & Download">📸</button>

      <button class="btn-download" id="btnDownload">
        <span>Save</span> ⬇️
      </button>
    </div>
  </div>

  <canvas id="captureCanvas"></canvas>

  <script>
    const video = document.getElementById('videoPreview');
    const imgPreview = document.getElementById('imagePreview');
    const fileInput = document.getElementById('fileInput');
    const captureCanvas = document.getElementById('captureCanvas');

    const btnSwitchCamera = document.getElementById('btnSwitchCamera');
    const btnUpload = document.getElementById('btnUpload');
    const btnToggleSliders = document.getElementById('btnToggleSliders');
    const btnCapture = document.getElementById('btnCapture');
    const btnDownload = document.getElementById('btnDownload');
    const slidersPanel = document.getElementById('slidersPanel');

    // Filter adjustments state
    const adjustments = {
      brightness: 100,
      contrast: 100,
      saturate: 100,
      hueRotate: 0,
      baseFilter: ''
    };

    let currentStream = null;
    let facingMode = 'user'; // 'user' (front) or 'environment' (back)
    let isUsingCamera = true;

    // Filter preset definitions
    const filterPresets = {
      normal: { filter: '', brightness: 100, contrast: 100, saturate: 100, hue: 0 },
      grayscale: { filter: 'grayscale(100%)', brightness: 100, contrast: 120, saturate: 0, hue: 0 },
      sepia: { filter: 'sepia(100%)', brightness: 95, contrast: 110, saturate: 120, hue: 0 },
      vintage: { filter: 'sepia(40%) contrast(120%) brightness(90%) hue-rotate(-15deg)', brightness: 90, contrast: 120, saturate: 85, hue: 345 },
      cyberpunk: { filter: 'contrast(150%) saturate(220%) hue-rotate(185deg)', brightness: 110, contrast: 150, saturate: 220, hue: 185 },
      dramatic: { filter: 'contrast(160%) brightness(85%)', brightness: 85, contrast: 160, saturate: 110, hue: 0 },
      warm: { filter: 'sepia(30%) saturate(150%)', brightness: 105, contrast: 105, saturate: 150, hue: 10 },
      cool: { filter: 'hue-rotate(190deg) saturate(90%)', brightness: 100, contrast: 115, saturate: 90, hue: 190 },
      invert: { filter: 'invert(100%)', brightness: 100, contrast: 100, saturate: 100, hue: 0 }
    };

    // Initialize Camera
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = currentStream;
        video.style.display = 'block';
        imgPreview.style.display = 'none';
        isUsingCamera = true;
      } catch (err) {
        console.warn("Could not access camera or facing mode not supported:", err);
      }
    }

    // Toggle Camera Facing
    btnSwitchCamera.addEventListener('click', () => {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      startCamera();
    });

    // File Upload Handler
    btnUpload.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }
        imgPreview.src = event.target.result;
        imgPreview.style.display = 'block';
        video.style.display = 'none';
        isUsingCamera = false;
      };
      reader.readAsDataURL(file);
    });

    // Apply Filter Styles
    function updateStyles() {
      const filterString = `${adjustments.baseFilter} brightness(${adjustments.brightness}%) contrast(${adjustments.contrast}%) saturate(${adjustments.saturate}%) hue-rotate(${adjustments.hueRotate}deg)`;
      const activeElement = isUsingCamera ? video : imgPreview;
      activeElement.style.filter = filterString;
    }

    // Preset Buttons Click
    document.querySelectorAll('.preset-btn').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        const presetKey = button.getAttribute('data-filter');
        const p = filterPresets[presetKey];

        adjustments.baseFilter = p.filter;
        adjustments.brightness = p.brightness;
        adjustments.contrast = p.contrast;
        adjustments.saturate = p.saturate;
        adjustments.hueRotate = p.hue;

        // Sync slider values
        document.getElementById('sliderBrightness').value = p.brightness;
        document.getElementById('sliderContrast').value = p.contrast;
        document.getElementById('sliderSaturation').value = p.saturate;
        document.getElementById('sliderHue').value = p.hue;

        document.getElementById('valBrightness').innerText = `${p.brightness}%`;
        document.getElementById('valContrast').innerText = `${p.contrast}%`;
        document.getElementById('valSaturation').innerText = `${p.saturate}%`;
        document.getElementById('valHue').innerText = `${p.hue}°`;

        updateStyles();
      });
    });

    // Slider Controls Listeners
    function setupSlider(id, labelId, property, suffix = '%') {
      const slider = document.getElementById(id);
      const label = document.getElementById(labelId);
      slider.addEventListener('input', (e) => {
        adjustments[property] = e.target.value;
        label.innerText = `${e.target.value}${suffix}`;
        updateStyles();
      });
    }

    setupSlider('sliderBrightness', 'valBrightness', 'brightness', '%');
    setupSlider('sliderContrast', 'valContrast', 'contrast', '%');
    setupSlider('sliderSaturation', 'valSaturation', 'saturate', '%');
    setupSlider('sliderHue', 'valHue', 'hueRotate', '°');

    btnToggleSliders.addEventListener('click', () => {
      slidersPanel.style.display = (slidersPanel.style.display === 'grid') ? 'none' : 'grid';
    });

    // Capture & Download Rendering to Canvas
    function captureAndDownload() {
      const source = isUsingCamera ? video : imgPreview;
      const width = isUsingCamera ? video.videoWidth : imgPreview.naturalWidth;
      const height = isUsingCamera ? video.videoHeight : imgPreview.naturalHeight;

      if (!width || !height) return;

      captureCanvas.width = width;
      captureCanvas.height = height;
      const ctx = captureCanvas.getContext('2d');

      // Recreate CSS filters inside Canvas 2D context
      ctx.filter = `${adjustments.baseFilter} brightness(${adjustments.brightness}%) contrast(${adjustments.contrast}%) saturate(${adjustments.saturate}%) hue-rotate(${adjustments.hueRotate}deg)`;
      
      // Mirror if user front camera
      if (isUsingCamera && facingMode === 'user') {
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
      }

      ctx.drawImage(source, 0, 0, width, height);

      // Download file
      const link = document.createElement('a');
      link.download = `filter-photo-${Date.now()}.png`;
      link.href = captureCanvas.toDataURL('image/png');
      link.click();
    }

    btnCapture.addEventListener('click', captureAndDownload);
    btnDownload.addEventListener('click', captureAndDownload);

    // Initial Startup
    window.addEventListener('DOMContentLoaded', () => {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        startCamera();
      }
    });
  </script>
</body>
</html>
