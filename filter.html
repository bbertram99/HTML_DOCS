<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SnapFilter Studio</title>
  <!-- MediaPipe Face Mesh for Snapchat-style AR tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #131c2e;
      --accent: #00f2fe;
      --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #24344d;
      --active-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(9, 13, 22, 0.95);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Filter Toggle Button */
    .btn-toggle-filter {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-toggle-filter.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--active-green);
      color: #34d399;
    }

    .btn-toggle-filter .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }

    .btn-toggle-filter.active .dot {
      background: var(--active-green);
      box-shadow: 0 0 8px var(--active-green);
    }

    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* Main Viewport */
    .viewport-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    /* Hidden video/img feed sources */
    #sourceVideo, #sourceImage {
      display: none;
    }

    /* Output Canvas displaying live video + AR face mesh */
    #renderCanvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    #fileInput {
      display: none;
    }

    /* Status indicator */
    .tracking-status {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 0.72rem;
      color: #38bdf8;
      pointer-events: none;
      z-index: 10;
    }

    /* Controls Bottom Deck */
    .controls-panel {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    /* Presets Strip */
    .category-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding: 8px 14px 2px;
    }

    .presets-bar {
      display: flex;
      gap: 10px;
      padding: 6px 14px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .presets-bar::-webkit-scrollbar {
      display: none;
    }

    .preset-card {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: #0d1525;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: all 0.2s ease;
    }

    .preset-card .icon {
      font-size: 1.3rem;
    }

    .preset-card.active {
      border-color: var(--accent);
      background: rgba(0, 242, 254, 0.1);
      color: #fff;
    }

    /* Fine-tune panel */
    .sliders-panel {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 14px;
      padding: 10px 16px;
      background: rgba(9, 13, 22, 0.8);
      border-top: 1px solid var(--border);
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .slider-group div {
      display: flex;
      justify-content: space-between;
    }

    .slider-group input[type="range"] {
      accent-color: #00f2fe;
    }

    /* Shutter Bar */
    .action-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 16px 16px;
    }

    .btn-action-side {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-shutter {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid var(--bg-card);
      outline: 2px solid #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: transform 0.1s;
    }

    .btn-shutter:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <h1>SnapFilter</h1>
    </div>
    
    <div class="top-actions">
      <!-- Quick Filter ON / OFF Toggle -->
      <button id="btnToggleFilter" class="btn-toggle-filter active" title="Toggle Filters">
        <span class="dot"></span>
        <span id="filterStateText">FILTER: ON</span>
      </button>

      <button id="btnSwitchCamera" class="btn-icon" title="Switch Camera">🔄</button>
      <button id="btnUpload" class="btn-icon" title="Upload Photo">📁</button>
      <input type="file" id="fileInput" accept="image/*">
    </div>
  </header>

  <div class="viewport-container">
    <div class="tracking-status" id="trackingStatus">Initializing camera & AI...</div>
    
    <!-- Render output -->
    <canvas id="renderCanvas"></canvas>
    
    <!-- Hidden input elements for processing -->
    <video id="sourceVideo" autoplay playsinline></video>
    <img id="sourceImage" alt="Upload source">
  </div>

  <div class="controls-panel">
    <div class="category-title">Snapchat Lenses &amp; Shaders</div>
    <div class="presets-bar" id="presetsBar">
      <div class="preset-card active" data-filter="normal">
        <span class="icon">✨</span>
        <span>Natural</span>
      </div>
      <div class="preset-card" data-filter="puppy">
        <span class="icon">🐶</span>
        <span>Puppy</span>
      </div>
      <div class="preset-card" data-filter="sunglasses">
        <span class="icon">🕶️</span>
        <span>Thug Shades</span>
      </div>
      <div class="preset-card" data-filter="cyberpunk">
        <span class="icon">🥽</span>
        <span>Cyber Visor</span>
      </div>
      <div class="preset-card" data-filter="crown">
        <span class="icon">👑</span>
        <span>Gold Halo</span>
      </div>
      <div class="preset-card" data-filter="vhs">
        <span class="icon">📼</span>
        <span>VHS 90s</span>
      </div>
      <div class="preset-card" data-filter="thermal">
        <span class="icon">🌡️</span>
        <span>Thermal</span>
      </div>
      <div class="preset-card" data-filter="vintage">
        <span class="icon">🎞️</span>
        <span>Film Gold</span>
      </div>
      <div class="preset-card" data-filter="noir">
        <span class="icon">🎬</span>
        <span>Noir B&amp;W</span>
      </div>
    </div>

    <!-- Sliders -->
    <div class="sliders-panel" id="slidersPanel">
      <div class="slider-group">
        <div><span>Brightness</span><span id="lblBright">100%</span></div>
        <input type="range" id="rngBright" min="20" max="200" value="100">
      </div>
      <div class="slider-group">
        <div><span>Contrast</span><span id="lblContrast">100%</span></div>
        <input type="range" id="rngContrast" min="20" max="200" value="100">
      </div>
      <div class="slider-group">
        <div><span>Saturation</span><span id="lblSat">100%</span></div>
        <input type="range" id="rngSat" min="0" max="250" value="100">
      </div>
      <div class="slider-group">
        <div><span>Hue</span><span id="lblHue">0°</span></div>
        <input type="range" id="rngHue" min="0" max="360" value="0">
      </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
      <button class="btn-action-side" id="btnToggleSliders">
        <span style="font-size: 1.2rem;">⚙️</span>
        <span>Sliders</span>
      </button>

      <button class="btn-shutter" id="btnCapture" title="Take Snap">📸</button>

      <button class="btn-action-side" id="btnDownload">
        <span style="font-size: 1.2rem;">💾</span>
        <span>Save</span>
      </button>
    </div>
  </div>

  <script>
    // Elements
    const video = document.getElementById('sourceVideo');
    const imgPreview = document.getElementById('sourceImage');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const trackingStatus = document.getElementById('trackingStatus');
    const btnToggleFilter = document.getElementById('btnToggleFilter');
    const filterStateText = document.getElementById('filterStateText');
    const fileInput = document.getElementById('fileInput');
    const btnUpload = document.getElementById('btnUpload');
    const btnSwitchCamera = document.getElementById('btnSwitchCamera');
    const btnCapture = document.getElementById('btnCapture');
    const btnDownload = document.getElementById('btnDownload');
    const btnToggleSliders = document.getElementById('btnToggleSliders');
    const slidersPanel = document.getElementById('slidersPanel');

    // State
    let isFilterEnabled = true;
    let activeFilter = 'normal';
    let isCamera = true;
    let facingMode = 'user';
    let currentStream = null;
    let faceMesh = null;
    let latestLandmarks = null;
    let frameCount = 0;

    const adjustments = {
      brightness: 100,
      contrast: 100,
      saturation: 100,
      hue: 0
    };

    // Filter On/Off Switch
    btnToggleFilter.addEventListener('click', () => {
      isFilterEnabled = !isFilterEnabled;
      btnToggleFilter.classList.toggle('active', isFilterEnabled);
      filterStateText.textContent = isFilterEnabled ? "FILTER: ON" : "FILTER: OFF";
      if (!isCamera) renderStaticImage();
    });

    // Preset selection
    document.querySelectorAll('.preset-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.preset-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        activeFilter = card.getAttribute('data-filter');
        if (!isFilterEnabled) {
          isFilterEnabled = true;
          btnToggleFilter.classList.add('active');
          filterStateText.textContent = "FILTER: ON";
        }
        if (!isCamera) renderStaticImage();
      });
    });

    // Slider Controls
    function wireSlider(sliderId, labelId, prop, unit) {
      const slider = document.getElementById(sliderId);
      const label = document.getElementById(labelId);
      slider.addEventListener('input', (e) => {
        adjustments[prop] = e.target.value;
        label.textContent = `${e.target.value}${unit}`;
        if (!isCamera) renderStaticImage();
      });
    }
    wireSlider('rngBright', 'lblBright', 'brightness', '%');
    wireSlider('rngContrast', 'lblContrast', 'contrast', '%');
    wireSlider('rngSat', 'lblSat', 'saturation', '%');
    wireSlider('rngHue', 'lblHue', 'hue', '°');

    btnToggleSliders.addEventListener('click', () => {
      slidersPanel.style.display = (slidersPanel.style.display === 'grid') ? 'none' : 'grid';
    });

    // Initialize MediaPipe Face Mesh
    function initFaceMesh() {
      faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults((results) => {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          latestLandmarks = results.multiFaceLandmarks[0];
          trackingStatus.textContent = "Face locked ✨";
        } else {
          latestLandmarks = null;
          trackingStatus.textContent = "Detecting face...";
        }
        renderLiveFrame();
      });
    }

    // Camera Init
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = currentStream;
        await video.play();

        isCamera = true;
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        processCameraLoop();
      } catch (err) {
        trackingStatus.textContent = "Camera error: " + err.message;
      }
    }

    async function processCameraLoop() {
      if (!isCamera) return;
      if (video.readyState >= 2 && faceMesh) {
        await faceMesh.send({ image: video });
      }
      requestAnimationFrame(processCameraLoop);
    }

    btnSwitchCamera.addEventListener('click', () => {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      startCamera();
    });

    // File Upload Handler
    btnUpload.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
        }
        isCamera = false;
        imgPreview.src = event.target.result;
        imgPreview.onload = async () => {
          canvas.width = imgPreview.naturalWidth;
          canvas.height = imgPreview.naturalHeight;
          trackingStatus.textContent = "Analyzing uploaded photo...";
          if (faceMesh) {
            await faceMesh.send({ image: imgPreview });
          }
          renderStaticImage();
        };
      };
      reader.readAsDataURL(file);
    });

    // Color Grading CSS Filter Computation
    function getCssFilterString() {
      if (!isFilterEnabled) return 'none';

      let base = '';
      if (activeFilter === 'vintage') {
        base = 'sepia(45%) contrast(115%) brightness(95%) saturate(85%)';
      } else if (activeFilter === 'noir') {
        base = 'grayscale(100%) contrast(140%) brightness(90%)';
      } else if (activeFilter === 'cyberpunk') {
        base = 'contrast(125%) saturate(160%) hue-rotate(170deg)';
      } else if (activeFilter === 'vhs') {
        base = 'contrast(120%) saturate(130%) brightness(105%)';
      } else if (activeFilter === 'thermal') {
        base = 'invert(100%) saturate(300%) hue-rotate(90deg) contrast(140%)';
      }

      return `${base} brightness(${adjustments.brightness}%) contrast(${adjustments.contrast}%) saturate(${adjustments.saturation}%) hue-rotate(${adjustments.hue}deg)`.trim();
    }

    // AR Drawing Methods
    function renderLiveFrame() {
      if (!isCamera) return;
      drawCompositedScene(video);
    }

    function renderStaticImage() {
      drawCompositedScene(imgPreview);
    }

    function drawCompositedScene(source) {
      frameCount++;
      const w = canvas.width;
      const h = canvas.height;

      ctx.save();
      // Mirror if front selfie camera
      const isMirrored = isCamera && facingMode === 'user';
      if (isMirrored) {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
      }

      // Base Video / Image with Color Adjustments
      ctx.filter = getCssFilterString();
      ctx.drawImage(source, 0, 0, w, h);
      ctx.filter = 'none'; // reset filter for AR drawing

      // Render AR Overlays if filter is ON
      if (isFilterEnabled && latestLandmarks) {
        renderARLayers(w, h);
      }

      // Screen Shader Overlays (VHS lines / timestamps)
      if (isFilterEnabled && activeFilter === 'vhs') {
        renderVHSEffects(w, h);
      }

      ctx.restore();
    }

    // AR Landmark Attachment Calculation
    function getFaceTransform(lm, idxA, idxB, w, h) {
      const p1 = { x: lm[idxA].x * w, y: lm[idxA].y * h };
      const p2 = { x: lm[idxB].x * w, y: lm[idxB].y * h };
      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      return { p1, p2, angle, dist };
    }

    function renderARLayers(w, h) {
      const lm = latestLandmarks;
      // Key facial points:
      // 33: left outer eye, 263: right outer eye
      // 1: nose tip, 10: forehead center, 152: chin
      const eyeTransform = getFaceTransform(lm, 33, 263, w, h);
      const nose = { x: lm[1].x * w, y: lm[1].y * h };
      const forehead = { x: lm[10].x * w, y: lm[10].y * h };
      const leftCheek = { x: lm[234].x * w, y: lm[234].y * h };
      const rightCheek = { x: lm[454].x * w, y: lm[454].y * h };

      ctx.save();

      // 1. Puppy Filter (Snapchat classic dog)
      if (activeFilter === 'puppy') {
        // Snout / Nose
        ctx.fillStyle = "#3e2723";
        ctx.beginPath();
        ctx.ellipse(nose.x, nose.y, eyeTransform.dist * 0.22, eyeTransform.dist * 0.16, eyeTransform.angle, 0, Math.PI * 2);
        ctx.fill();

        // Cheeks Blush
        ctx.fillStyle = "rgba(255, 99, 132, 0.4)";
        ctx.beginPath();
        ctx.arc(leftCheek.x, leftCheek.y, eyeTransform.dist * 0.18, 0, Math.PI * 2);
        ctx.arc(rightCheek.x, rightCheek.y, eyeTransform.dist * 0.18, 0, Math.PI * 2);
        ctx.fill();

        // Ears
        const earSize = eyeTransform.dist * 0.65;
        drawPuppyEar(eyeTransform.p1.x - earSize * 0.3, eyeTransform.p1.y - earSize * 1.3, earSize, -0.4 + eyeTransform.angle);
        drawPuppyEar(eyeTransform.p2.x + earSize * 0.3, eyeTransform.p2.y - earSize * 1.3, earSize, 0.4 + eyeTransform.angle);
      }

      // 2. Thug Life / Pixel Sunglasses
      if (activeFilter === 'sunglasses') {
        ctx.save();
        const midX = (eyeTransform.p1.x + eyeTransform.p2.x) / 2;
        const midY = (eyeTransform.p1.y + eyeTransform.p2.y) / 2;
        ctx.translate(midX, midY);
        ctx.rotate(eyeTransform.angle);

        const glassW = eyeTransform.dist * 1.5;
        const glassH = glassW * 0.32;

        ctx.fillStyle = "#111";
        ctx.fillRect(-glassW / 2, -glassH / 2, glassW, glassH);

        // White reflection gloss stripes
        ctx.fillStyle = "#fff";
        ctx.fillRect(-glassW * 0.35, -glassH * 0.35, glassW * 0.08, glassH * 0.7);
        ctx.fillRect(glassW * 0.15, -glassH * 0.35, glassW * 0.08, glassH * 0.7);
        ctx.restore();
      }

      // 3. Cyberpunk HUD Visor
      if (activeFilter === 'cyberpunk') {
        ctx.save();
        const midX = (eyeTransform.p1.x + eyeTransform.p2.x) / 2;
        const midY = (eyeTransform.p1.y + eyeTransform.p2.y) / 2;
        ctx.translate(midX, midY);
        ctx.rotate(eyeTransform.angle);

        const visorW = eyeTransform.dist * 1.6;
        const visorH = visorW * 0.3;

        ctx.fillStyle = "rgba(0, 242, 254, 0.4)";
        ctx.strokeStyle = "#00f2fe";
        ctx.lineWidth = 3;
        ctx.shadowColor = "#00f2fe";
        ctx.shadowBlur = 15;

        ctx.strokeRect(-visorW / 2, -visorH / 2, visorW, visorH);
        ctx.fillRect(-visorW / 2, -visorH / 2, visorW, visorH);

        // Tech target crosses
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-visorW * 0.25, -visorH * 0.3);
        ctx.lineTo(-visorW * 0.25, visorH * 0.3);
        ctx.moveTo(visorW * 0.25, -visorH * 0.3);
        ctx.lineTo(visorW * 0.25, visorH * 0.3);
        ctx.stroke();
        ctx.restore();
      }

      // 4. Crown & Floating Sparkles
      if (activeFilter === 'crown') {
        ctx.save();
        ctx.translate(forehead.x, forehead.y);
        ctx.rotate(eyeTransform.angle);

        const crownW = eyeTransform.dist * 1.2;
        const crownH = crownW * 0.55;

        ctx.fillStyle = "#fbbf24";
        ctx.shadowColor = "#f59e0b";
        ctx.shadowBlur = 20;

        ctx.beginPath();
        ctx.moveTo(-crownW / 2, 0);
        ctx.lineTo(-crownW / 2, -crownH * 0.7);
        ctx.lineTo(-crownW * 0.25, -crownH * 0.35);
        ctx.lineTo(0, -crownH);
        ctx.lineTo(crownW * 0.25, -crownH * 0.35);
        ctx.lineTo(crownW / 2, -crownH * 0.7);
        ctx.lineTo(crownW / 2, 0);
        ctx.closePath();
        ctx.fill();

        // Shimmering Jewels
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(0, -crownH * 0.5, crownW * 0.06, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      ctx.restore();
    }

    function drawPuppyEar(x, y, size, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = "#8d6e63";
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 0.4, size * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#d7ccc8";
      ctx.beginPath();
      ctx.ellipse(0, size * 0.15, size * 0.25, size * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // VHS Scanline and OSD Overlay
    function renderVHSEffects(w, h) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
      for (let y = 0; y < h; y += 4) {
        ctx.fillRect(0, y, w, 1.5);
      }

      ctx.font = "bold 22px 'Courier New', monospace";
      ctx.fillStyle = "#34d399";
      ctx.fillText("REC ●", 30, 45);

      const now = new Date();
      ctx.fillText(`SEP 14 1996  ${now.toTimeString().split(' ')[0]}`, 30, h - 30);
    }

    // Save/Download Output Image
    function saveSnapshot() {
      const link = document.createElement('a');
      link.download = `snapfilter-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    btnCapture.addEventListener('click', saveSnapshot);
    btnDownload.addEventListener('click', saveSnapshot);

    // Bootstrap
    window.addEventListener('DOMContentLoaded', () => {
      initFaceMesh();
      startCamera();
    });
  </script>
</body>
</html>
